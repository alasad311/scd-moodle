<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      height: 44px;
      background: #1a1a2e;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 10px;
      /* allow dragging the window from the toolbar */
      -webkit-app-region: drag;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    #back-btn,
    #reload-btn {
      -webkit-app-region: no-drag;
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      color: #e0e0e0;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
      flex-shrink: 0;
    }

    #back-btn:hover,
    #reload-btn:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    #back-btn:active,
    #reload-btn:active {
      background: rgba(255, 255, 255, 0.28);
    }

    /* Dim with colour, NOT opacity: toggling opacity here crashes the GPU
       process on some drivers (Chromium 118), which forces the whole app
       into slow software rendering. */
    #back-btn:disabled,
    #back-btn:disabled:hover,
    #back-btn:disabled:active {
      color: rgba(224, 224, 224, 0.3);
      background: rgba(255, 255, 255, 0.03);
      cursor: default;
    }

    /* Spinner shown during page load */
    #spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top-color: #4f9cf9;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
      display: none;
    }

    #spinner.visible {
      display: block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Left / right groups share the free space equally so the title stays centred */
    .group {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .group.right { justify-content: flex-end; }

    /* Title label */
    #title {
      color: rgba(255, 255, 255, 0.55);
      font-size: 13px;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    /* Version label (opens About) */
    #version-btn {
      -webkit-app-region: no-drag;
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.45);
      font: inherit;
      font-size: 12px;
      padding: 4px 6px;
      border-radius: 5px;
      cursor: pointer;
    }
    #version-btn:hover { background: rgba(255, 255, 255, 0.10); color: #e0e0e0; }

    /* Update indicator. NOTE: no `opacity` anywhere in this file (GPU crash bug). */
    #update {
      -webkit-app-region: no-drag;
      display: none;
      align-items: center;
      gap: 7px;
      height: 28px;
      padding: 0 11px;
      border: none;
      border-radius: 14px;
      font: inherit;
      font-size: 12px;
      white-space: nowrap;
      background: rgba(79, 156, 249, 0.16);
      color: #9cc6ff;
      cursor: default;
    }
    #update.visible { display: flex; }
    #update.action {
      background: #2e9d5b;
      color: #ffffff;
      cursor: pointer;
    }
    #update.action:hover { background: #36b46a; }
    #update .mini-spin {
      width: 12px;
      height: 12px;
      border: 2px solid rgba(156, 198, 255, 0.3);
      border-top-color: #9cc6ff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    #update .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ffffff;
    }
  </style>
</head>
<body>
  <div class="group left">
    <button id="back-btn" title="Go Back">←</button>
    <button id="reload-btn" title="Reload (F5)">↺</button>
    <div id="spinner"></div>
  </div>
  <span id="title">SCD Moodle</span>
  <div class="group right">
    <button id="update" type="button"></button>
    <button id="version-btn" type="button" title="About SCD Moodle"></button>
  </div>

  <script>
    const backBtn   = document.getElementById('back-btn');
    const reloadBtn = document.getElementById('reload-btn');
    const spinner   = document.getElementById('spinner');

    backBtn.addEventListener('click', () => {
      window.electronAPI.goBack();
    });

    reloadBtn.addEventListener('click', () => {
      window.electronAPI.refresh();
    });

    window.electronAPI.onLoadingState((isLoading) => {
      spinner.classList.toggle('visible', isLoading);
    });

    window.electronAPI.onCanGoBack((canGoBack) => {
      backBtn.disabled = !canGoBack;
    });

    // ── Version + update indicator ───────────────────────────────────────
    const versionBtn = document.getElementById('version-btn');
    const updateEl   = document.getElementById('update');
    versionBtn.addEventListener('click', () => window.electronAPI.showAbout());
    updateEl.addEventListener('click', () => {
      if (updateEl.classList.contains('action')) window.electronAPI.installUpdate();
    });

    function renderUpdate(u) {
      updateEl.className = '';
      updateEl.textContent = '';
      updateEl.removeAttribute('title');
      if (!u) return;
      if (u.state === 'downloading') {
        const s = document.createElement('span'); s.className = 'mini-spin';
        updateEl.append(s, 'Downloading update…');
        updateEl.title = 'A new version is downloading in the background. You can keep working.';
        updateEl.classList.add('visible');
      } else if (u.state === 'ready') {
        const d = document.createElement('span'); d.className = 'dot';
        updateEl.append(d, u.version ? `Restart to update (v${u.version})` : 'Restart to update');
        updateEl.title = 'The update is downloaded. Click to restart and install it.';
        updateEl.classList.add('visible', 'action');
      } else if (u.state === 'available') {
        const d = document.createElement('span'); d.className = 'dot';
        updateEl.append(d, `Update available (v${u.version})`);
        updateEl.title = 'Click to download the new version.';
        updateEl.classList.add('visible', 'action');
      }
    }

    window.electronAPI.getAppInfo().then(({ version, update }) => {
      versionBtn.textContent = `v${version}`;
      renderUpdate(update);
    });
    window.electronAPI.onUpdateState(renderUpdate);
  </script>
</body>
</html>
