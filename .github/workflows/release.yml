name: Release

# Push a version tag (e.g. `git tag v1.1.1 && git push origin v1.1.1`) to build
# the Windows installer and the macOS DMG/zip and upload them to a draft GitHub
# Release. Publishing that draft makes the Windows update available to every
# installed copy of the app. (The macOS build is unsigned, so it cannot
# auto-update; Mac users download the new DMG manually.)
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-macos:
    # Runs after Windows so both upload into the same draft release.
    needs: publish-windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Universal = one app that runs natively on Apple Silicon and Intel Macs.
      - run: npm run publish -- --platform=darwin --arch=universal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
