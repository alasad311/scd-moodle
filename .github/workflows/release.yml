name: Release

# Push a version tag (e.g. `git tag v1.1.1 && git push origin v1.1.1`) to build
# the Windows installer and the macOS DMG/zip and upload them to a draft GitHub
# Release. Publishing that draft makes the Windows update available to every
# installed copy of the app. (The macOS build is unsigned, so it cannot
# auto-update; Mac users download the new DMG manually.)
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Build a small delta update against the latest published release
      # (see forge.config.js). Skipped if there is no previous release.
      - name: Find previous release for delta updates
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prev=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          if [ -n "$prev" ] && [ "$prev" != "$GITHUB_REF_NAME" ]; then
            echo "Delta base: $prev"
            echo "SQUIRREL_REMOTE_RELEASES=https://github.com/$GITHUB_REPOSITORY/releases/download/$prev" >> "$GITHUB_ENV"
          else
            echo "No previous release; full package only."
          fi
      - run: npm run publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-macos:
    # Runs after Windows so both upload into the same draft release.
    needs: publish-windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Universal = one app that runs natively on Apple Silicon and Intel Macs.
      - run: npm run publish -- --platform=darwin --arch=universal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
